<text x="181.2" y="80.0" class="t2" font-size="12" text-anchor="start" font-weight="400">FreeRTOS task</text>
<rect x="282.0" y="71.0" width="10.0" height="10.0" rx="2" class="ws3 ks3"/>
<text x="297.0" y="80.0" class="t2" font-size="12" text-anchor="start" font-weight="400">shared buffer</text>
<rect x="397.8" y="71.0" width="10.0" height="10.0" rx="2" class="wn axis"/>
<text x="412.8" y="80.0" class="t2" font-size="12" text-anchor="start" font-weight="400">peripheral / host</text>
<path d="M540.0,71.0l4,4l-4,4l-4,-4z" class="s2"/>
<text x="550.0" y="80.0" class="t2" font-size="11" text-anchor="start" font-weight="400">counted drop point</text>
<rect x="24.0" y="104.0" width="156.0" height="52.0" rx="6" class="ws4 ks4" stroke-width="1.5"/>
<text x="36.0" y="126.0" class="t1" font-size="13" text-anchor="start" font-weight="600">TIM3 update ISR</text>
<text x="36.0" y="144.0" class="t2" font-size="11" text-anchor="start" font-weight="400">prio 4 · stamps t_us</text>
