<svg xmlns="http://www.w3.org/2000/svg" width="940" height="492" viewBox="0 0 940 492" role="img" aria-labelledby="t d" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif'>
<title id="t">RTTelemetry data path</title><desc id="d">Data path: TIM3 ISR starts an ADC1 scan via DMA2; the DMA ISR pushes a sample record into a lock-free SPSC ring; proc_task batches into a fixed frame pool shared with imu_task, health_task and cmd_task; tx_task encodes and sends over USART2 by DMA to the host decoder. Commands return through the USART2 RX ISR to cmd_task. Drops are counted at the ADC trigger, the ring and the frame pool; the host detects link loss.</desc>
<style>.bg{fill:#fcfcfb;stroke:rgba(11,11,11,0.10)}.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#6f6d68}.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.ref{stroke:#52514e}.s1{fill:#2a78d6}.ks1{stroke:#2a78d6}.ws1{fill:#2a78d6;fill-opacity:.16}.s2{fill:#eb6834}.ks2{stroke:#eb6834}.ws2{fill:#eb6834;fill-opacity:.16}.s3{fill:#1baf7a}.ks3{stroke:#1baf7a}.ws3{fill:#1baf7a;fill-opacity:.16}.s4{fill:#eda100}.ks4{stroke:#eda100}.ws4{fill:#eda100;fill-opacity:.16}.wn{fill:#0b0b0b;fill-opacity:.05}.ring{stroke:#fcfcfb}@media (prefers-color-scheme:dark){.bg{fill:#1a1a19;stroke:rgba(255,255,255,0.10)}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.t3{fill:#a3a29b}.grid{stroke:#2c2c2a}.axis{stroke:#383835}.ref{stroke:#c3c2b7}.s1{fill:#3987e5}.ks1{stroke:#3987e5}.ws1{fill:#3987e5;fill-opacity:.16}.s2{fill:#d95926}.ks2{stroke:#d95926}.ws2{fill:#d95926;fill-opacity:.16}.s3{fill:#199e70}.ks3{stroke:#199e70}.ws3{fill:#199e70;fill-opacity:.16}.s4{fill:#c98500}.ks4{stroke:#c98500}.ws4{fill:#c98500;fill-opacity:.16}.wn{fill:#ffffff;fill-opacity:.05}.ring{stroke:#1a1a19}}</style>
<rect x="0.5" y="0.5" width="939.0" height="491.0" rx="8" class="bg"/>
<text x="24.0" y="34.0" class="t1" font-size="15" text-anchor="start" font-weight="600">RTTelemetry data path</text>
<text x="24.0" y="54.0" class="t2" font-size="12" text-anchor="start" font-weight="400">STM32F407 + FreeRTOS. The same firmware image runs unmodified in Renode.</text>
<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8z" class="t2"/></marker></defs>
<rect x="24.0" y="71.0" width="10.0" height="10.0" rx="2" class="ws4 ks4"/>
<text x="39.0" y="80.0" class="t2" font-size="12" text-anchor="start" font-weight="400">interrupt handler</text>
