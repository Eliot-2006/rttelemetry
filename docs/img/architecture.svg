<text x="772.0" y="284.0" class="t2" font-size="11" text-anchor="start" font-weight="400">4 frames, never blocks</text>
<rect x="576.0" y="244.0" width="156.0" height="52.0" rx="6" class="ws1 ks1" stroke-width="1.5"/>
<text x="588.0" y="266.0" class="t1" font-size="13" text-anchor="start" font-weight="600">tx_task</text>
<text x="588.0" y="284.0" class="t2" font-size="11" text-anchor="start" font-weight="400">prio 4 · COBS + CRC-16</text>
<rect x="392.0" y="244.0" width="156.0" height="52.0" rx="6" class="wn axis" stroke-width="1.5"/>
<text x="404.0" y="266.0" class="t1" font-size="13" text-anchor="start" font-weight="600">USART2 TX</text>
<text x="404.0" y="284.0" class="t2" font-size="11" text-anchor="start" font-weight="400">DMA1 S6 · 921600 baud</text>
<rect x="24.0" y="244.0" width="340.0" height="52.0" rx="6" class="wn axis" stroke-width="1.5"/>
<text x="36.0" y="266.0" class="t1" font-size="13" text-anchor="start" font-weight="600">Host decoder (Python)</text>
<text x="36.0" y="284.0" class="t2" font-size="11" text-anchor="start" font-weight="400">CRC, seq gaps, conservation check</text>
