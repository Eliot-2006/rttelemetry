<text x="437.7" y="314.0" class="t2" font-size="12" text-anchor="middle" font-weight="400">2,000 Hz</text>
<path d="M529.0,296.0V262.2Q529.0,262.2 529.0,262.2H553.0Q553.0,262.2 553.0,262.2V296.0Z" class="s1"/>
<path d="M529.0,260.2V232.5Q529.0,228.5 533.0,228.5H549.0Q553.0,228.5 553.0,232.5V260.2Z" class="s2"/>
<text x="541.0" y="220.5" class="t1" font-size="11" text-anchor="middle" font-weight="600">50% delivered</text>
<text x="541.0" y="314.0" class="t2" font-size="12" text-anchor="middle" font-weight="400">4,000 Hz</text>
<path d="M632.3,296.0V262.1Q632.3,262.1 632.3,262.1H656.3Q656.3,262.1 656.3,262.1V296.0Z" class="s1"/>
<path d="M632.3,260.1V164.5Q632.3,160.5 636.3,160.5H652.3Q656.3,160.5 656.3,164.5V260.1Z" class="s2"/>
<text x="644.3" y="152.5" class="t1" font-size="11" text-anchor="middle" font-weight="600">25% delivered</text>
<text x="644.3" y="314.0" class="t2" font-size="12" text-anchor="middle" font-weight="400">8,000 Hz</text>
<line x1="84.0" y1="134.0" x2="481.3" y2="134.0" class="ref" stroke-width="1" stroke-opacity=".55"/>
<text x="282.7" y="128.0" class="t1" font-size="12" text-anchor="middle" font-weight="600">zero loss up to 2,000 Hz</text>
<text x="84.0" y="158.0" class="t2" font-size="11" text-anchor="start" font-weight="400">Renode's ADC needs 400 µs per scan (D13),</text>
<text x="84.0" y="173.0" class="t2" font-size="11" text-anchor="start" font-weight="400">so it caps out near 2,500 samples/s.</text>
<text x="696.0" y="332.0" class="t3" font-size="11" text-anchor="end" font-weight="400">Requested sample rate (4 channels per sample)</text>
<text x="68.0" y="114.0" class="t3" font-size="11" text-anchor="end" font-weight="400">samples/s</text>
</svg>
